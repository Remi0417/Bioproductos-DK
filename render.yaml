# Blueprint de Render para BioProductos DK.
# Crea 3 servicios: la base de datos (PostgreSQL), la API (Django) y el sitio (Next.js).
# Los secretos (tokens de Shopify, contraseña del admin) NO van aquí: Render los
# pide en su panel al crear el Blueprint (sync: false).
#
# Si Render agrega un sufijo a algún nombre (porque ya existe), actualiza
# CORS_ALLOWED_ORIGINS, NEXT_PUBLIC_BASE_URL y NEXT_PUBLIC_API_URL con las URL reales.

databases:
  - name: bioproductos-dk-db
    plan: free
    databaseName: bioproductosdk
    user: bioproductos

services:
  # API: Django + Django REST Framework (carpeta backend/)
  - type: web
    name: bioproductos-dk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: gunicorn biobackend.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATABASE_URL
        fromDatabase:
          name: bioproductos-dk-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: CORS_ALLOWED_ORIGINS
        value: https://bioproductos-dk-web.onrender.com
      - key: SHOPIFY_STORE_DOMAIN
        value: bioproductos-dk-prototipo.myshopify.com
      - key: SHOPIFY_API_VERSION
        value: "2026-10"
      - key: SHOPIFY_STOREFRONT_PRIVATE_TOKEN
        sync: false
      # Usuario del admin de Django, creado en el primer despliegue (build.sh)
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  # Sitio: Next.js con el diseño de Byron (carpeta frontend/, monorepo npm)
  - type: web
    name: bioproductos-dk-web
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm ci && npm run build --workspace=@dtc/storefront
    startCommand: npm run start:render --workspace=@dtc/storefront
    envVars:
      - key: DK_DEMO_PREVIEW
        value: "true"
      - key: NEXT_PUBLIC_BASE_URL
        value: https://bioproductos-dk-web.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: https://bioproductos-dk-api.onrender.com
      - key: NEXT_PUBLIC_DEFAULT_REGION
        value: cl
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
